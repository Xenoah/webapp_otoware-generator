name: Publish release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the standalone HTML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          notes="ブラウザで動く音割れメーカー。ゲイン調整（∞対応）、ピーク制限、波形・オシロ・FFT表示、複数音源のWAV一括ZIP保存に対応します。添付の index.html をダウンロードして直接開けます。"
          gh release create "$tag" index.html --target "$GITHUB_SHA" --title "音割れメーカー $tag" --notes "$notes"
